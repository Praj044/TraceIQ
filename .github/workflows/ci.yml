
name: TraceIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traceiq
          POSTGRES_USER: traceiq_user
          POSTGRES_PASSWORD: traceiq_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceiq_user -d traceiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://traceiq_user:traceiq_test_password@localhost:5432/traceiq
      AUTH_SECRET_KEY: ci-test-secret-not-for-production
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade heads

      - name: Run backend tests
        run: python -m pytest -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
